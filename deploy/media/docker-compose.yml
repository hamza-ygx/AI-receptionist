# Media + agent host (one Ubuntu VM in Sweden Central). Host networking is required by LiveKit SIP/RTP.
# Secrets come from /etc/rkjh/*.env (written by bootstrap.sh from Key Vault), never from this repo.
# Nothing listens publicly except SIP (5060) and SIP RTP (10000-20000), restricted to Twilio in the NSG.
x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  redis:
    logging: *logging
    image: redis:7.4-alpine
    network_mode: host
    restart: unless-stopped
    command: ["redis-server", "--bind", "127.0.0.1", "--port", "6379", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  livekit:
    logging: *logging
    image: livekit/livekit-server:v1.13.9
    network_mode: host
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on: [redis]

  sip:
    logging: *logging
    image: livekit/sip:v1.18.0
    network_mode: host
    restart: unless-stopped
    environment:
      SIP_CONFIG_FILE: /etc/sip.yaml
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    volumes:
      - ./sip.yaml:/etc/sip.yaml:ro
    depends_on: [livekit]

  agent:
    logging: *logging
    image: ${AGENT_IMAGE}
    network_mode: host
    restart: unless-stopped
    env_file: [/etc/rkjh/agent.env]
    environment:
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    depends_on: [livekit, sip]

volumes:
  redis-data:
