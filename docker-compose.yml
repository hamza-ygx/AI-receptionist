services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rkjh
      POSTGRES_PASSWORD: rkjh_local_only
      POSTGRES_DB: rkjh
      TZ: Europe/Stockholm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command: azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
volumes:
  pgdata:
